<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <title>Pesquisa Culturama</title>
</head>

<body>
   
    <header>
        <img src="img/logo-culturama.png" alt="logo culturama">  
        <h1>Pesquisa Culturama</h1>
    </header>
    
    <section> 
        
        <form action = "#" method = "get">
            
            <fieldset> 
              <legend>Dados Pessoais</legend>

    <!--DADOS PESSOAIS-->
              <label for="name">Nome:</label>
              <input id= "name" type="text" name="userName" required>
              <br>
            
              <label for="age">Idade:</label>
              <input id="age" type="number" name="userAge" min="12" max="100" required>
              <br>
            
              <label for="birthDate">Data de Nascimento:</label>
              <input id="birthDate" type="date" name="userBirthDate">
              <br>
            
              <label for="email">E-mail:</label>
              <input id="email" type="email" name="userEmail" required>
              <br>
            
              <label for="phoneNumber">Telefone:</label>
              <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número sem espaços">
              <br>
            
              <label for="image">Upload de Foto:</label>
              <input id="image" type="file" accept="image/*" name="userImage">
              <br>
            
            </fieldset>

            <fieldset>      
              <legend>Perfil</legend> 

              <p>Gênero:</p>
              <input id="fem" type="radio" name="userGender" value="feminino">
              <label for="fem">Feminino</label>
              
              <input id="masc" type="radio" name="userGender" value="masculino">
              <label for="masc">Masculino</label>

              <input id="notInformed" type="radio" name="userGender" value="notInformed">
              <label for="notInformed">Prefiro não informar</label>
              <br>

              <label for="maritalStatus">Estado Civil:</label>
            
            <select id="maritalStatus" name="userMaritalStatus">
                <option value="notInformed">Selecione</option>
                <option value="casado">Casado</option>
                <option value="solteiro">Solteiro</option>
                <option value="divorciado">Divorciado</option>
                <option value="casado">União Estável</option>
            </select>

            <label for="state">Estado:</label>
            <select id="state" name="userState" required>
                <option value="">Selecione seu estado</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
           </select>

           <label for="city">Cidade:</label>
           <input id="city" type="text" name="cidade">


            </fieldset> 
            
            <fieldset>
                <legend>Hábitos</legend>
                
                <p>Redes Sociais:</p>
                
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>

                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>

                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">Linkedin</label>
                <br>

                <input id="twitter" type="checkbox" name="social" value="twitter">
                <label for="twitter">Twitter</label>
                <br>

                <label for="musicStyle">Estilo Musical:</label>
                <input id="musicStyle" type="text" name="userMusicStyle" list="stylesTypes">
                <datalist id="stylesTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Sertanejo">
                    <option value="Funk">
                </datalist>
                <br>
                
                <label for="favoriteColor">Cor Favorita:</label>
                <input id="favoriteColor" type="color" name="userFavoriteColor">
            
            </fieldset>

            <fieldset>
                <legend>Opnião</legend>

                <p>O que você acha da qualidade do nosso serviço?</p>

                <input type="radio" id="otimo" name="opiniao" value="otimo">
                <label for="otimo">Ótimo</label>
                <br>

                <input type="radio" id="boa" name="opiniao" value="boa">
                <label for="boa">Boa</label>
                <br>

                <input type="radio" id="regular" name="opiniao" value="regular">
                <label for="regular">Regular</label>
                <br>

                <input type="radio" id="ruim" name="opiniao" value="ruim">
                <label for="ruim">Ruim</label>
                <br>

                <label for="comment">Escreva sua opnião:</label>
                <textarea id="comment" name="userComment" placeholder="Digite aqui sua opnião..."></textarea> 

            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>

                <input type="checkbox" id="userLgpdTerm" name="userLgpd" value="aceppted" required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
                <br>

                <input type="checkbox" id="getResult" name="userGetResult" value="accepted">
                <label for="getResult">Desejo receber o resultado por email</label>
                <br>

            </fieldset>
                
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>

        </form>
    
    </section>
            
</body>
</html>
